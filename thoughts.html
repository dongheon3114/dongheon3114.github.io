---
layout: default
title: 생각
permalink: /thoughts/
---
<h1>생각</h1>
<ul class="post-list">
  {% for post in site.categories.thoughts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <time>{{ post.date | date: "%Y.%m.%d" }}</time>
  </li>
  {% else %}
  <li>아직 기록한 생각이 없어요.</li>
  {% endfor %}
</ul>
