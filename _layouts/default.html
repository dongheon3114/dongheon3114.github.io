<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 150 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body data-user="{{ site.github_username }}" data-repo="{% if site.github_repo %}{{ site.github_repo }}{% else %}{{ site.github_username }}.github.io{% endif %}" data-branch="{{ site.github_branch | default: 'main' }}" data-home="{{ '/' | relative_url }}">
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/diary/' | relative_url }}">일기</a>
      <a href="{{ '/thoughts/' | relative_url }}">생각</a>
      <a href="{{ '/book/' | relative_url }}">책</a>
      <a href="{{ '/about/' | relative_url }}">소개</a>
      <a class="write-btn" href="{{ '/write/' | relative_url }}">✎ 글쓰기</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    © {{ 'now' | date: '%Y' }} {{ site.author }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </footer>
  <script src="{{ '/assets/js/owner.js' | relative_url }}"></script>
</body>
</html>
