---
layout: default
title: 글쓰기
permalink: /write/
---
<h1>글쓰기</h1>

<form id="writer" class="writer" onsubmit="return false">
  <div class="kinds" role="radiogroup" aria-label="글 종류">
    <label><input type="radio" name="kind" value="diary" checked> 일기</label>
    <label><input type="radio" name="kind" value="thoughts"> 생각</label>
    <label><input type="radio" name="kind" value="book"> 책</label>
  </div>

  <label class="field chapter-field" hidden>
    <span>몇 번째 장인가요?</span>
    <input type="number" id="chapter" min="1" value="{{ site.book.size | plus: 1 }}">
  </label>

  <label class="field">
    <span>제목</span>
    <input type="text" id="title" placeholder="오늘의 제목" required>
  </label>

  <label class="field">
    <span>본문</span>
    <textarea id="body" rows="16" placeholder="자유롭게 쓰세요. 빈 줄을 넣으면 문단이 나뉩니다."></textarea>
  </label>

  <div class="actions">
    <button type="button" id="publish" class="btn-primary">올리기</button>
    <button type="button" id="clear" class="btn-ghost">지우기</button>
    <span id="status" class="status" aria-live="polite"></span>
  </div>

  <p class="hint">
    "올리기"를 누르면 GitHub가 새 창으로 열려요. 내용이 이미 채워져 있으니
    오른쪽 위 초록색 <b>Commit changes</b>만 누르면 1~2분 뒤 블로그에 나타납니다.
    쓰던 글은 이 브라우저에 자동으로 임시 저장돼요.
  </p>
</form>

<script>
(function () {
  var USER = {{ site.github_username | jsonify }};
  var REPO = {{ site.github_repo | default: "" | jsonify }} || (USER + ".github.io");
  var BRANCH = {{ site.github_branch | default: "main" | jsonify }};
  var DRAFT_KEY = "blog-draft";
  var MAX_URL = 7000; // 이보다 길면 본문은 클립보드로 넘김

  var $ = function (id) { return document.getElementById(id); };
  var form = $("writer");
  var chapterField = form.querySelector(".chapter-field");

  function kind() { return form.querySelector('input[name="kind"]:checked').value; }
  function pad(n) { return String(n).padStart(2, "0"); }

  function sync() { chapterField.hidden = kind() !== "book"; }
  form.querySelectorAll('input[name="kind"]').forEach(function (r) {
    r.addEventListener("change", function () { sync(); save(); });
  });

  // 임시 저장
  function save() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        kind: kind(), title: $("title").value, body: $("body").value, chapter: $("chapter").value
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (!d) return;
      var r = form.querySelector('input[name="kind"][value="' + d.kind + '"]');
      if (r) r.checked = true;
      $("title").value = d.title || "";
      $("body").value = d.body || "";
      if (d.chapter) $("chapter").value = d.chapter;
    } catch (e) {}
  }
  ["title", "body", "chapter"].forEach(function (id) { $(id).addEventListener("input", save); });

  $("clear").addEventListener("click", function () {
    if (!$("title").value && !$("body").value) return;
    $("title").value = ""; $("body").value = "";
    save(); $("status").textContent = "지웠어요.";
  });

  $("publish").addEventListener("click", function () {
    var title = $("title").value.trim();
    var body = $("body").value.replace(/\s+$/, "");
    if (!USER || USER === "아이디") {
      $("status").textContent = "_config.yml의 github_username을 먼저 내 아이디로 바꿔 주세요.";
      return;
    }
    if (!title) { $("status").textContent = "제목을 적어 주세요."; $("title").focus(); return; }

    var now = new Date();
    var safeTitle = title.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    var k = kind(), dir, filename, front;

    if (k === "book") {
      var ch = parseInt($("chapter").value, 10) || 1;
      dir = "_book";
      filename = pad(ch) + "-chapter-" + ch + ".md";
      front = '---\ntitle: "' + safeTitle + '"\nchapter: ' + ch + "\n---\n\n";
    } else {
      var date = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
      var time = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      dir = "_posts";
      filename = date + "-" + time + ".md";
      front = '---\ntitle: "' + safeTitle + '"\ncategories: ' + k + "\n---\n\n";
    }

    var base = "https://github.com/" + USER + "/" + REPO + "/new/" + BRANCH + "/" + dir +
               "?filename=" + encodeURIComponent(filename) + "&value=";
    var full = base + encodeURIComponent(front + body + "\n");

    if (full.length <= MAX_URL) {
      window.open(full, "_blank");
      $("status").textContent = "GitHub에서 Commit changes를 눌러 주세요.";
    } else {
      // 글이 너무 길면 머리말만 채우고 본문은 복사해 둠
      var copied = navigator.clipboard ? navigator.clipboard.writeText(body) : Promise.reject();
      copied.then(function () {
        window.open(base + encodeURIComponent(front + "(여기에 붙여넣기)\n"), "_blank");
        $("status").textContent = "글이 길어서 본문을 복사해 뒀어요. GitHub에서 '(여기에 붙여넣기)'를 지우고 붙여넣은 뒤 Commit 하세요.";
      }, function () {
        $("status").textContent = "글이 너무 길어 자동으로 넘기지 못했어요. 본문을 직접 복사해 주세요.";
      });
    }
  });

  load(); sync();
})();
</script>
