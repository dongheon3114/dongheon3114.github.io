title: "나의 기록장"
description: "생각 정리 노트, 감정일기, 책 모음집, 좋아하는 문구"
author: "동헌"

url: "https://dongheon3114.github.io"
github_username: "dongheon3114"
baseurl: ""

timezone: Asia/Seoul
lang: ko

# ─────────────────────────────────────────────
#  아래는 건드리지 않아도 됩니다
# ─────────────────────────────────────────────
permalink: /:categories/:year/:month/:day/:title/
markdown: kramdown

collections:
  book:
    output: true
    permalink: /book/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: book }
    values: { layout: chapter }

plugins:
  - jekyll-feed

exclude:
  - README.md
  - _templates
