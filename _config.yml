# ─────────────────────────────────────────────
#  여기만 바꾸면 블로그 정보가 바뀝니다
# ─────────────────────────────────────────────
title: "나의 기록장"
description: "매일의 일기, 떠오른 생각, 천천히 쓰는 책"
author: "나"

url: "https://dongheon3114.github.io"
baseurl: ""

timezone: Asia/Seoul
lang: ko

# ─────────────────────────────────────────────
#  아래는 건드리지 않아도 됩니다
# ─────────────────────────────────────────────
permalink: /:categories/:year/:month/:day/:title/
markdown: kramdown

collections:
  book:
    output: true
    permalink: /book/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: book }
    values: { layout: chapter }

plugins:
  - jekyll-feed

exclude:
  - README.md
  - _templates
