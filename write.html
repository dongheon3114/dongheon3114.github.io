---
layout: default
title: 글쓰기
permalink: /write/
---
<h1 id="page-title">글쓰기</h1>

<form id="writer" class="writer" onsubmit="return false">
  <div class="kinds" role="radiogroup" aria-label="글 종류">
    <label><input type="radio" name="kind" value="diary" checked> 일기</label>
    <label><input type="radio" name="kind" value="thoughts"> 생각</label>
    <label><input type="radio" name="kind" value="book"> 책</label>
  </div>

  <label class="field chapter-field" hidden>
    <span>몇 번째 장인가요?</span>
    <input type="number" id="chapter" min="1" value="{{ site.book.size | plus: 1 }}">
  </label>

  <label class="field">
    <span>제목</span>
    <input type="text" id="title" placeholder="오늘의 제목" required>
  </label>

  <label class="field">
    <span>본문</span>
    <textarea id="body" rows="16" placeholder="자유롭게 쓰세요. 빈 줄을 넣으면 문단이 나뉩니다."></textarea>
  </label>

  <div class="actions">
    <button type="button" id="publish" class="btn-primary">올리기</button>
    <button type="button" id="clear" class="btn-ghost">지우기</button>
    <span id="status" class="status" aria-live="polite"></span>
  </div>

  <p class="hint">쓰던 글은 이 브라우저에 자동으로 임시 저장돼요. 올린 글은 1~2분 뒤 블로그에 나타납니다.</p>

  <details class="setup" id="setup">
    <summary id="setup-summary">연결 설정</summary>
    <p>
      이 화면에서 바로 글을 올리려면 GitHub 열쇠(토큰)를 한 번만 넣어 두면 돼요.
      열쇠는 <b>이 브라우저에만</b> 저장되고, 다른 사람에게는 보이지 않아요.
      열쇠가 없는 기기에서는 "올리기"를 누르면 GitHub 화면으로 넘어가요.
    </p>
    <label class="field">
      <span>GitHub 토큰</span>
      <input type="password" id="token" placeholder="github_pat_로 시작하는 값" autocomplete="off">
    </label>
    <div class="actions">
      <button type="button" id="save-token" class="btn-ghost">저장</button>
      <button type="button" id="forget-token" class="btn-ghost">이 기기에서 지우기</button>
    </div>
  </details>
</form>

<script>
(function () {
  var USER = {{ site.github_username | jsonify }};
  var REPO = {{ site.github_repo | default: "" | jsonify }} || (USER + ".github.io");
  var BRANCH = {{ site.github_branch | default: "main" | jsonify }};
  var DRAFT_KEY = "blog-draft", TOKEN_KEY = "blog-token";
  var MAX_URL = 7000;

  var $ = function (id) { return document.getElementById(id); };
  var form = $("writer");
  var chapterField = form.querySelector(".chapter-field");
  function say(t) { $("status").textContent = t; }
  function kind() { return form.querySelector('input[name="kind"]:checked').value; }
  function pad(n) { return String(n).padStart(2, "0"); }
  function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function fetchStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function sync() { chapterField.hidden = kind() !== "book"; }
  form.querySelectorAll('input[name="kind"]').forEach(function (r) {
    r.addEventListener("change", function () { sync(); save(); });
  });

  // ── 수정 모드 상태 ──
  var editing = null; // { path, sha, front: [줄들] }
  var editPath = new URLSearchParams(location.search).get("edit");

  // ── 임시 저장 ──
  function save() {
    if (editing || editPath) return; // 수정 중인 글은 임시 저장하지 않음
    store(DRAFT_KEY, JSON.stringify({ kind: kind(), title: $("title").value, body: $("body").value, chapter: $("chapter").value }));
  }
  function load() {
    try {
      var d = JSON.parse(fetchStore(DRAFT_KEY) || "null");
      if (!d) return;
      var r = form.querySelector('input[name="kind"][value="' + d.kind + '"]');
      if (r) r.checked = true;
      $("title").value = d.title || ""; $("body").value = d.body || "";
      if (d.chapter) $("chapter").value = d.chapter;
    } catch (e) {}
  }
  ["title", "body", "chapter"].forEach(function (id) { $(id).addEventListener("input", save); });
  $("clear").addEventListener("click", function () {
    if (editing) { location.href = location.pathname; return; } // 수정 취소 → 새 글 쓰기로
    $("title").value = ""; $("body").value = ""; save(); say("지웠어요.");
  });

  // ── 토큰 ──
  function refreshSetup() {
    var has = !!fetchStore(TOKEN_KEY);
    $("setup-summary").textContent = has ? "연결 설정 · 연결됨 ✓" : "연결 설정 · 아직 연결 안 됨";
    $("token").value = "";
    $("token").placeholder = has ? "저장되어 있어요" : "github_pat_로 시작하는 값";
  }
  $("save-token").addEventListener("click", function () {
    var t = $("token").value.trim();
    if (!t) return;
    store(TOKEN_KEY, t); refreshSetup(); say("연결했어요. 이제 이 기기에서 바로 올릴 수 있어요.");
    if (editPath && !editing) enterEditMode();
  });
  $("forget-token").addEventListener("click", function () {
    store(TOKEN_KEY, null); refreshSetup(); say("이 기기에서 토큰을 지웠어요.");
  });

  // ── 파일 만들기 ──
  function buildFile() {
    var title = $("title").value.trim();
    var body = $("body").value.replace(/\s+$/, "");
    var safe = title.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    var now = new Date(), k = kind();
    if (k === "book") {
      var ch = parseInt($("chapter").value, 10) || 1;
      return { dir: "_book", name: pad(ch) + "-chapter-" + ch + ".md", title: title, body: body,
               front: '---\ntitle: "' + safe + '"\nchapter: ' + ch + "\n---\n\n" };
    }
    var date = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
    var time = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    return { dir: "_posts", name: date + "-" + time + ".md", title: title, body: body,
             front: '---\ntitle: "' + safe + '"\ncategories: ' + k + "\n---\n\n" };
  }

  function b64(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function publishDirect(f, token) {
    var path = f.dir + "/" + f.name;
    var api = "https://api.github.com/repos/" + USER + "/" + REPO + "/contents/" + path;
    var headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
    $("publish").disabled = true; say("올리는 중…");
    return fetch(api + "?ref=" + BRANCH, { headers: headers }).then(function (r) {
      if (r.status === 200) throw { msg: "같은 장 번호의 글이 이미 있어요. 장 번호를 바꿔 주세요." };
      return fetch(api, {
        method: "PUT", headers: headers,
        body: JSON.stringify({ message: "새 글: " + f.title, content: b64(f.front + f.body + "\n"), branch: BRANCH })
      });
    }).then(function (r) {
      if (r.status === 401) throw { msg: "토큰이 맞지 않거나 만료됐어요. 연결 설정에서 다시 넣어 주세요." };
      if (r.status === 403 || r.status === 404) throw { msg: "토큰에 이 저장소 쓰기 권한이 없어요. 토큰 설정을 확인해 주세요." };
      if (!r.ok) throw { msg: "올리지 못했어요 (오류 " + r.status + ")." };
      $("title").value = ""; $("body").value = ""; save();
      say("올렸어요! 1~2분 뒤 블로그에 나타나요.");
    }).catch(function (e) {
      say(e && e.msg ? e.msg : "인터넷 연결을 확인해 주세요. 쓰던 글은 남아 있어요.");
    }).then(function () { $("publish").disabled = false; });
  }

  // ── 기존 글 불러오기 / 수정 저장 ──
  function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function contentsApi(p) { return "https://api.github.com/repos/" + USER + "/" + REPO + "/contents/" + encPath(p); }
  function authHeaders(token) { return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }; }

  function unb64(s) {
    var bin = atob(s.replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function unquote(v) {
    v = (v || "").trim();
    if (v.charAt(0) === '"') { try { return JSON.parse(v); } catch (e) {} }
    return v.replace(/^['"]|['"]$/g, "");
  }
  function frontValue(lines, key) {
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(new RegExp("^" + key + ":\\s*(.*)$"));
      if (m) return m[1];
    }
    return "";
  }
  function setFront(lines, key, value) {
    for (var i = 0; i < lines.length; i++) {
      if (new RegExp("^" + key + ":").test(lines[i])) { lines[i] = key + ": " + value; return; }
    }
    lines.push(key + ": " + value);
  }

  function enterEditMode() {
    var token = fetchStore(TOKEN_KEY);
    $("page-title").textContent = "글 수정";
    $("publish").textContent = "수정 저장";
    $("clear").textContent = "취소";
    form.querySelectorAll('input[name="kind"]').forEach(function (r) { r.disabled = true; });
    if (!token) {
      say("수정하려면 아래 연결 설정에서 토큰을 먼저 넣어 주세요.");
      $("setup").open = true;
      return;
    }
    say("글을 불러오는 중…");
    $("publish").disabled = true;
    fetch(contentsApi(editPath) + "?ref=" + BRANCH, { headers: authHeaders(token), cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) throw { msg: "글을 찾지 못했어요. 이미 삭제된 글일 수 있어요." };
        if (r.status === 401) throw { msg: "토큰이 맞지 않거나 만료됐어요. 연결 설정에서 다시 넣어 주세요." };
        if (!r.ok) throw { msg: "글을 불러오지 못했어요 (오류 " + r.status + ")." };
        return r.json();
      })
      .then(function (d) {
        var text = unb64(d.content);
        var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---[ \t]*\r?\n?([\s\S]*)$/);
        var front = m ? m[1].split(/\r?\n/) : [];
        var body = m ? m[2].replace(/^(\r?\n)+/, "") : text;
        var k = /^_book\//.test(editPath) ? "book"
              : (/thoughts/.test(frontValue(front, "categories")) ? "thoughts" : "diary");
        form.querySelector('input[name="kind"][value="' + k + '"]').checked = true;
        sync();
        $("title").value = unquote(frontValue(front, "title"));
        $("body").value = body.replace(/\s+$/, "");
        if (k === "book") $("chapter").value = parseInt(frontValue(front, "chapter"), 10) || 1;
        editing = { path: editPath, sha: d.sha, front: front };
        say("");
      })
      .catch(function (e) { say(e && e.msg ? e.msg : "인터넷 연결을 확인해 주세요."); })
      .then(function () { $("publish").disabled = false; });
  }

  function saveEdit() {
    var token = fetchStore(TOKEN_KEY);
    var title = $("title").value.trim();
    var safe = title.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    var lines = editing.front.slice();
    setFront(lines, "title", '"' + safe + '"');
    if (/^_book\//.test(editing.path)) setFront(lines, "chapter", parseInt($("chapter").value, 10) || 1);
    var text = "---\n" + lines.join("\n") + "\n---\n\n" + $("body").value.replace(/\s+$/, "") + "\n";
    $("publish").disabled = true; say("저장하는 중…");
    fetch(contentsApi(editing.path), {
      method: "PUT", headers: authHeaders(token),
      body: JSON.stringify({ message: "글 수정: " + title, content: b64(text), sha: editing.sha, branch: BRANCH })
    }).then(function (r) {
      if (r.status === 409) throw { msg: "그 사이 다른 곳에서 이 글이 바뀌었어요. 새로고침한 뒤 다시 수정해 주세요." };
      if (r.status === 401) throw { msg: "토큰이 맞지 않거나 만료됐어요. 연결 설정에서 다시 넣어 주세요." };
      if (r.status === 403 || r.status === 404) throw { msg: "토큰에 이 저장소 쓰기 권한이 없어요." };
      if (!r.ok) throw { msg: "저장하지 못했어요 (오류 " + r.status + ")." };
      return r.json();
    }).then(function (d) {
      editing.sha = d.content.sha;
      editing.front = lines;
      say("저장했어요! 1~2분 뒤 블로그에 반영돼요.");
    }).catch(function (e) {
      say(e && e.msg ? e.msg : "인터넷 연결을 확인해 주세요. 고친 내용은 화면에 남아 있어요.");
    }).then(function () { $("publish").disabled = false; });
  }

  function publishViaGitHub(f) {
    var base = "https://github.com/" + USER + "/" + REPO + "/new/" + BRANCH + "/" + f.dir +
               "?filename=" + encodeURIComponent(f.name) + "&value=";
    var full = base + encodeURIComponent(f.front + f.body + "\n");
    if (full.length <= MAX_URL) {
      window.open(full, "_blank");
      say("GitHub에서 Commit changes를 눌러 주세요.");
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(f.body).then(function () {
        window.open(base + encodeURIComponent(f.front + "(여기에 붙여넣기)\n"), "_blank");
        say("글이 길어서 본문을 복사해 뒀어요. GitHub에서 붙여넣은 뒤 Commit 하세요.");
      });
    }
  }

  $("publish").addEventListener("click", function () {
    if (!USER || USER === "아이디") { say("_config.yml의 github_username을 먼저 내 아이디로 바꿔 주세요."); return; }
    if (!$("title").value.trim()) { say("제목을 적어 주세요."); $("title").focus(); return; }
    if (editPath) {
      if (editing) saveEdit();
      else say("글을 아직 불러오지 못했어요. 연결 설정을 확인한 뒤 새로고침해 주세요.");
      return;
    }
    var f = buildFile(), token = fetchStore(TOKEN_KEY);
    token ? publishDirect(f, token) : publishViaGitHub(f);
  });

  refreshSetup();
  if (editPath) { enterEditMode(); } else { load(); sync(); }
})();
</script>
